<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHARACTER LAB · 준비 중</title>
<style>
  :root { --bg:#f6f4ef; --ink:#1d1d1f; --sub:#6b6b70; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141416; --ink:#f2f2f2; --sub:#9a9aa0; } }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  main { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:0 16px; box-sizing:border-box; }
  h1 { font-size:clamp(2.2rem, 8vw, 4.5rem); letter-spacing:.08em; margin:0 0 .4em; }
  p { margin:.3em 0; color:var(--sub); line-height:1.6; }
  .soon { margin-top:1.6em; color:var(--ink); font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>CHARACTER LAB</h1>
  <p>경기과학기술대학교 웹툰일러스트학과</p>
  <p>「이미지 생성툴 활용」 2학년 중간 발표전 가상 전시장</p>
  <p class="soon">전시장을 준비하고 있습니다.</p>
</main>
</body>
</html>
